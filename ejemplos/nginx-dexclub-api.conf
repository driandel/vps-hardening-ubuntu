# Sitio de la API, detrás de nginx como proxy inverso.
#
# OJO AL COPIARLO: la zona 'cuentas' que usan los limit_req de abajo NO
# se declara aquí, sino en nginx.conf, dentro del bloque http:
#
#     limit_req_zone $binary_remote_addr zone=cuentas:10m rate=5r/m;
#     limit_req_status 429;
#
# Sin la primera línea nginx no arranca con esta configuración. La segunda
# no es obligatoria pero sí conviene: por defecto nginx corta con un 503,
# que significa "el servidor está roto" e invita al cliente a reintentar.
# Un 429 dice "vas muy rápido", que es lo que pasa de verdad, y es además
# lo que devuelve la API cuando corta por su cuenta.
#
# Las líneas marcadas 'managed by Certbot' las escribió certbot solo al
# emitir el certificado; se dejan tal cual.

server {
    server_name api.<dominio>;

    # Solo HTTPS durante un año, también en subdominios. El navegador ni
    # siquiera intenta la conexión en claro.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Que nadie interprete una respuesta como un tipo distinto del que dice.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Esto es una API: no tiene por qué mostrarse dentro de un marco.
    add_header X-Frame-Options "DENY" always;
    # La versión de nginx no ayuda a nadie salvo a quien busca fallos
    # conocidos de esa versión.
    server_tokens off;

    # Cinco intentos por minuto y por IP en las rutas de cuenta, con margen
    # para tres seguidos. Una persona no necesita más; un ataque de fuerza
    # bruta, sí.
    #
    # Esto frena el RITMO. El volumen lo cuenta la API por su cuenta: ocho
    # fallos de login en quince minutos, por cuenta y por IP. nginx corta
    # una ráfaga pero se reabre en cuanto se baja a una petición cada doce
    # segundos; quien prueba despacio solo lo para el contador de la API.
    location /login {
        limit_req zone=cuentas burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /registro {
        limit_req zone=cuentas burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /recuperar {
        limit_req zone=cuentas burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # X-Forwarded-For es lo que permite a la API ver la IP real. Sin ella
    # vería todas las peticiones viniendo de 127.0.0.1 y su límite por IP
    # sería un límite global. Solo es de fiar porque la pone este nginx y
    # la API escucha en loopback: si se pudiera llegar a ella directamente,
    # cualquiera se la inventaría.

    # El archivo de precios, servido como archivo estático: no pasa por la
    # API ni toca la base de datos. Se comprime al vuelo porque es JSON muy
    # repetitivo: 1.064.368 bytes bajan a 224.861, un 79 % menos. Medido con
    #     curl -s -H 'Accept-Encoding: gzip' https://api.<dominio>/precios.json | wc -c
    location = /precios.json {
        root /var/www/dexclub;
        gzip on;
        gzip_types application/json;

        # LAS CABECERAS DE SEGURIDAD HAY QUE REPETIRLAS AQUÍ.
        #
        # add_header no se acumula: si un bloque anidado declara UNO solo,
        # pierde TODOS los heredados del nivel de arriba. Con el
        # Cache-Control a secas, esta ruta se servía sin HSTS, sin nosniff,
        # sin Referrer-Policy y sin X-Frame-Options, mientras el resto del
        # sitio sí las llevaba. No da ningún error y no se ve leyendo el
        # archivo: solo mirando las cabeceras de la respuesta.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;

        # Una hora de caché: la app solo lo pide una vez al día, pero así
        # varios arranques seguidos no lo descargan otra vez.
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.<dominio>/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.<dominio>/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = api.<dominio>) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.<dominio>;
    return 404; # managed by Certbot


}
