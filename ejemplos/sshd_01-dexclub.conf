# Endurecimiento de SSH para DexClub.
#
# Va en 01- para leerse ANTES que los archivos de la imagen del
# proveedor (50-cloud-init y 60-cloudimg-settings): en SSH gana el PRIMER
# valor leído, no el último, y editar sshd_config no habría servido de nada.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AllowUsers <usuario>
MaxAuthTries 3
LoginGraceTime 30
